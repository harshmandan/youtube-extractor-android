plugins{
    id 'com.android.library'
    id 'maven-publish'

}

repositories {
    mavenCentral()
    google()
    maven { url "https://jitpack.io" }
}

group = 'com.github.harshmandan'
version = '2.03'

android {
    namespace = "com.harshmandan.youtube_extractor"

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33
        compileSdk 33
        versionCode 23
        versionName "2.03"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }



    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.6.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:2d36945b392beb9804ff2b5afb05592f03c20609'
    implementation 'com.github.kotvertolet:youtube-jextractor:v0.3.4'
    implementation("com.squareup.okhttp3:okhttp:2.3.0")
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation  'org.mozilla:rhino:1.7.13'

}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.findByName('release')
                groupId = 'com.github.harshmandan'
                artifactId = 'youtube-extractor-android'
                version = '1.0'
            }
        }
    }
}
